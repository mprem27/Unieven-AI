# Optional development inbox. Messages stay in this local container.
services:
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - "127.0.0.1:${CAMPUS_MAIL_PORT:-8025}:8025"
    restart: unless-stopped
  campus:
    environment:
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      SMTP_REQUIRE_TLS: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      CAMPUS_MAIL_FROM: "Veltech mini <campus@localhost.invalid>"
    depends_on:
      mailpit:
        condition: service_started
