name: Build signed Android release
on:
  workflow_dispatch:
    inputs:
      require_domain_association:
        description: Require the deployed assetlinks.json to match this signing key
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    environment: android-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned SDK and generator
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.1.0' 'platform-tools'
          npm --prefix android ci
          npm --prefix android test
      - name: Restore the existing release key into temporary private storage
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          install -d -m 700 "$RUNNER_TEMP/android-private"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-private/velstudents-release.keystore"
          chmod 600 "$RUNNER_TEMP/android-private/velstudents-release.keystore"
      - name: Generate and verify a signed release
        env:
          CAMPUS_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          CAMPUS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_DOMAIN: ${{ inputs.require_domain_association }}
        run: |
          export CAMPUS_ANDROID_KEY_DIRECTORY="$RUNNER_TEMP/android-private"
          node scripts/android-prepare.mjs --config android/config.release.json --local-icon frontend/public/icons/app-512.png
          if [ "$REQUIRE_DOMAIN" = true ]; then
            node scripts/android-build.mjs --config android/config.release.json --require-domain-association
          else
            node scripts/android-build.mjs --config android/config.release.json
          fi
          node scripts/android-assetlinks.mjs --config android/config.release.json --fingerprint "$(node -p 'JSON.parse(require("fs").readFileSync("android/out/signing-receipt.json")).certificateSha256')"
      - name: Prepare verified public server release directory
        run: |
          node scripts/publish-android-release.mjs --apk=android/out/veltech-ams-mini-release.apk --receipt=android/out/signing-receipt.json --out=android/out/public-release
      - uses: actions/upload-artifact@v4
        with:
          name: veltech-ams-mini-android-release
          if-no-files-found: error
          path: |
            android/out/veltech-ams-mini-release.apk
            android/out/veltech-ams-mini-release.apk.sha256
            android/out/signing-receipt.json
            android/out/assetlinks.json
            android/out/public-release/
      - name: Remove temporary signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/android-private"
