name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:8.2.3
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/campus/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/academic/requirements.txt
      - run: npm run setup
      - run: python -m pip install -r services/academic/requirements.txt
      - run: npm --prefix frontend test
      - run: node --test --test-concurrency=4 campus/tests/*.test.js
        working-directory: services/campus
      - run: python -m unittest discover -s tests
        working-directory: services/academic
      - run: node --test android/tests/*.test.mjs
      - run: npm run build
